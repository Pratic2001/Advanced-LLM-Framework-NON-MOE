# =============================================================================
# Release workflow — builds and pushes the three production container images
# to Docker Hub, then bundles the runtime env files for the user to drop
# next to docker-compose.yml.
#
# Trigger:
#   • git tag matching v* (v1.2.3, v0.2.0, etc.)        → release
#   • workflow_dispatch                                   → manual rerun
#
# Output:
#   pratic2001/llmforge-ui-router:<TAG>+latest
#   pratic2001/llmforge-ui:<TAG>+latest
#   pratic2001/llmforge-trainer:<TAG>+latest
#   Artifact: env-bundle, containing secrets/{router,ui,ui-lite,trainer}.env
#
# Required GH Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME          — pratic2001
#   DOCKERHUB_TOKEN             — Docker Hub PAT
#   TS_AUTHKEY                  — Tailscale reusable auth key
#   PUBLIC_HOSTNAME             — e.g. pratic-battleaxb450mkm2.tail5e5151.ts.net
#   NEXTAUTH_SECRET             — same as the value in the running .env.local
#   AUTH_SECRET                 — same value as NEXTAUTH_SECRET (Auth.js uses
#                                 AUTH_SECRET to sign the session cookie, but
#                                 ws-manager verifies with NEXTAUTH_SECRET)
#   SSH_KEY_ENCRYPTION_KEY      — 32 hex chars (AES-256-GCM)
#   DATABASE_URL                — postgres:// connection string for the UI
#                                 container to reach host Postgres via
#                                 host.docker.internal:5432
#   SSH_PUBLIC_KEY              — openssh ed25519 public key the trainer
#                                 container accepts
#   SSH_PRIVATE_KEY             — openssh ed25519 private key the UI
#                                 container uses to SSH to the trainer
#   NEXT_PUBLIC_LITE_UI_URL     — optional override of the auto-derived
#   NEXT_PUBLIC_HEAVY_UI_URL      values below; leave unset to derive from
#                                 PUBLIC_HOSTNAME.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0). Leave empty for 'latest'."
        required: false
        default: "latest"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    # All secrets are wired through job-level env. GH Actions does NOT
    # expand `secrets.*` inside `strategy.matrix.*` (it errors with
    # "Unrecognized named-value: 'secrets'" at parse time), so derive
    # build args in a step below instead of inlining them here.
    env:
      PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
      NEXT_PUBLIC_HEAVY_UI_URL: ${{ secrets.NEXT_PUBLIC_HEAVY_UI_URL }}
      NEXT_PUBLIC_LITE_UI_URL: ${{ secrets.NEXT_PUBLIC_LITE_UI_URL }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui-router
            dockerfile: Dockerfile.ui-router
            context: .
            # Tag the kind of args this matrix entry needs; the build
            # step composes the actual KEY=VALUE list from env vars.
            args-kind: public-urls
          - name: ui
            dockerfile: Dockerfile.ui
            context: .
            args-kind: public-urls
          - name: trainer
            dockerfile: Dockerfile
            context: .
            args-kind: ssh-pubkey
    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compose build args from job-level env (which CAN read secrets).
      # Anything unset on the secret side falls back to the derived
      # PUBLIC_HOSTNAME form, matching what the env-bundle job does.
      - name: Compute build args
        id: buildargs
        env:
          KIND: ${{ matrix.args-kind }}
        run: |
          set -euo pipefail
          HOST="${PUBLIC_HOSTNAME}"
          if [[ -z "${HOST}" ]]; then
            echo "::error::PUBLIC_HOSTNAME secret is required"
            exit 1
          fi
          HEAVY="${NEXT_PUBLIC_HEAVY_UI_URL:-https://${HOST}/heavy}"
          LITE="${NEXT_PUBLIC_LITE_UI_URL:-https://${HOST}/lite}"
          PUBKEY="${SSH_PUBLIC_KEY:-}"

          case "${KIND}" in
            public-urls)
              # Heavy UI (BASE_PATH=/heavy) and UI_lite (BASE_PATH=/lite)
              # are both built in the same container from the same args;
              # ui-router ignores BASE_PATH/NEXTAUTH_URL so empty values
              # are fine.
              ARGS=$(printf 'NEXT_PUBLIC_HEAVY_UI_URL=%s\nNEXT_PUBLIC_LITE_UI_URL=%s\nNEXT_PUBLIC_BASE_PATH=\nNEXT_PUBLIC_NEXTAUTH_URL=' "${HEAVY}" "${LITE}")
              ;;
            ssh-pubkey)
              ARGS=$(printf 'UI_PUBKEY=%s' "${PUBKEY}")
              ;;
            *)
              echo "::error::unknown args-kind: ${KIND}"
              exit 1
              ;;
          esac
          {
            echo "args<<EOF"
            printf '%s' "${ARGS}"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            pratic2001/llmforge-${{ matrix.name }}:${{ steps.tag.outputs.value }}
            pratic2001/llmforge-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.title=llmforge-${{ matrix.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: ${{ steps.buildargs.outputs.args }}

  generate-env-bundle:
    name: Generate env-bundle
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # We don't actually need the source tree — just bash + secret material.
      - name: Set up env files
        env:
          PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SSH_KEY_ENCRYPTION_KEY: ${{ secrets.SSH_KEY_ENCRYPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_HEAVY_UI_URL: ${{ secrets.NEXT_PUBLIC_HEAVY_UI_URL }}
          NEXT_PUBLIC_LITE_UI_URL: ${{ secrets.NEXT_PUBLIC_LITE_UI_URL }}
          NEXT_PUBLIC_NEXTAUTH_URL: ${{ secrets.NEXT_PUBLIC_NEXTAUTH_URL }}
        run: |
          set -euo pipefail
          mkdir -p bundle/secrets

          if [[ -z "${PUBLIC_HOSTNAME}" ]]; then
            echo "::error::PUBLIC_HOSTNAME secret is required"
            exit 1
          fi

          # Derive any missing NEXT_PUBLIC_* values from PUBLIC_HOSTNAME.
          : "${NEXT_PUBLIC_HEAVY_UI_URL:=https://${PUBLIC_HOSTNAME}/heavy}"
          : "${NEXT_PUBLIC_LITE_UI_URL:=https://${PUBLIC_HOSTNAME}/lite}"
          # Auth.js client treats NEXTAUTH_URL's path as the FULL auth base
          # (including /api/auth). Derive that automatically so the user
          # only has to update PUBLIC_HOSTNAME in one place.
          : "${NEXT_PUBLIC_NEXTAUTH_URL:=https://${PUBLIC_HOSTNAME}/lite/api/auth}"

          # ── router.env — used by ui-router container ─────────────────
          cat > bundle/secrets/router.env <<EOF
          # Generated by release.yml — do not edit by hand.
          # Re-run the release workflow and redownload this bundle to update.
          NEXT_PUBLIC_HEAVY_UI_URL=${NEXT_PUBLIC_HEAVY_UI_URL}
          NEXT_PUBLIC_LITE_UI_URL=${NEXT_PUBLIC_LITE_UI_URL}
          EOF

          # ── ui.env — Heavy UI on :3000 ────────────────────────────────
          cat > bundle/secrets/ui.env <<EOF
          # Generated by release.yml — do not edit by hand.
          NODE_ENV=production
          PORT=3000
          HOSTNAME=0.0.0.0
          DATABASE_URL=${DATABASE_URL}
          NEXTAUTH_URL=https://${PUBLIC_HOSTNAME}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_TRUST_HOST=true
          NEXT_PUBLIC_BASE_PATH=/heavy
          NEXT_PUBLIC_NEXTAUTH_URL=https://${PUBLIC_HOSTNAME}/heavy/api/auth
          SSH_KEY_ENCRYPTION_KEY=${SSH_KEY_ENCRYPTION_KEY}
          REPO_ROOT=../Advanced-LLM-Framework-NON-MOE/
          EOF

          # ── ui-lite.env — UI_lite on :3001 ───────────────────────────
          cat > bundle/secrets/ui-lite.env <<EOF
          # Generated by release.yml — do not edit by hand.
          NODE_ENV=production
          PORT=3001
          HOSTNAME=0.0.0.0
          DATABASE_URL=${DATABASE_URL}
          NEXTAUTH_URL=https://${PUBLIC_HOSTNAME}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_TRUST_HOST=true
          NEXT_PUBLIC_BASE_PATH=/lite
          NEXT_PUBLIC_NEXTAUTH_URL=https://${PUBLIC_HOSTNAME}/lite/api/auth
          SSH_KEY_ENCRYPTION_KEY=${SSH_KEY_ENCRYPTION_KEY}
          REPO_ROOT=../Advanced-LLM-Framework-NON-MOE/
          EOF

          # ── trainer.env — currently only used for documentation; the
          # trainer container does not need any env vars to run the SSH
          # daemon. We still ship an empty file so the env_file: directive
          # in docker-compose.yml doesn't error.
          cat > bundle/secrets/trainer.env <<EOF
          # Generated by release.yml — do not edit by hand.
          # Trainer container has no runtime env requirements.
          EOF

          # README next to the bundle so the user knows what to do with it.
          cat > bundle/README.txt <<EOF
          env-bundle generated $(date -u +%FT%TZ)

          Contents:
            secrets/router.env      — UI_RenderRouter runtime config
            secrets/ui.env          — Heavy UI runtime config (:3000)
            secrets/ui-lite.env     — UI_lite runtime config (:3001)
            secrets/trainer.env     — Trainer runtime config (currently empty)

          Usage:
            mv bundle/secrets ./
            TS_AUTHKEY=tskey-xxxxxxxx  docker compose up -d

          (TS_AUTHKEY must be set in your shell or in ./secrets/ts-authkey.)

          The Tailscale auth key is NOT bundled — it's tied to your account
          and should never live in version control.
          EOF

          tar czf env-bundle.tar.gz -C bundle .

      - name: Upload env-bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-bundle
          path: env-bundle.tar.gz
          # 7 days is plenty for a release workflow.
          retention-days: 7

  smoke-test:
    name: Smoke test (compose up + curl)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # We don't have a GPU on the runner, so the trainer container would
      # crash on sshd without --gpus. Skip the GPU smoke here; CI's existing
      # ci.yml covers pretrain on CPU. For this job, only the UI containers
      # are exercised.
      - uses: actions/checkout@v4

      - name: Set up env files
        env:
          PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SSH_KEY_ENCRYPTION_KEY: ${{ secrets.SSH_KEY_ENCRYPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p secrets
          cat > secrets/router.env <<EOF
          NEXT_PUBLIC_HEAVY_UI_URL=https://example.test/heavy
          NEXT_PUBLIC_LITE_UI_URL=https://example.test/lite
          EOF
          cat > secrets/ui.env <<EOF
          NODE_ENV=production
          PORT=3000
          HOSTNAME=0.0.0.0
          DATABASE_URL=${DATABASE_URL}
          NEXTAUTH_URL=https://example.test
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_TRUST_HOST=true
          NEXT_PUBLIC_BASE_PATH=/heavy
          NEXT_PUBLIC_NEXTAUTH_URL=https://example.test/heavy/api/auth
          SSH_KEY_ENCRYPTION_KEY=${SSH_KEY_ENCRYPTION_KEY}
          EOF
          cat > secrets/ui-lite.env <<EOF
          NODE_ENV=production
          PORT=3001
          HOSTNAME=0.0.0.0
          DATABASE_URL=${DATABASE_URL}
          NEXTAUTH_URL=https://example.test
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_TRUST_HOST=true
          NEXT_PUBLIC_BASE_PATH=/lite
          NEXT_PUBLIC_NEXTAUTH_URL=https://example.test/lite/api/auth
          SSH_KEY_ENCRYPTION_KEY=${SSH_KEY_ENCRYPTION_KEY}
          EOF
          cat > secrets/trainer.env <<EOF
          EOF

      # Stub TS_AUTHKEY so the sidecars don't refuse to start.
      - name: Set dummy TS_AUTHKEY
        run: echo "TS_AUTHKEY=tskey-fake-ci-smoke" >> "$GITHUB_ENV"

      - name: Pull & boot
        run: |
          docker compose pull ui-router ui || true
          docker compose up -d ui-router ui
          # No trainer (no GPU). No sidecars either — they need a real
          # Tailscale auth key.

      # ── Debug: confirm the bind mount landed. If /secrets/ui.env is
      # missing here, the volume mount didn't take effect.
      - name: Debug: inspect /secrets inside ui container
        if: always()
        run: |
          echo "── docker compose ps ──"
          docker compose ps
          echo "── ls -la /secrets inside ui container ──"
          docker compose exec -T ui ls -la /secrets 2>&1 || echo "exec failed"
          echo "── ls -la ./secrets on the host ──"
          ls -la secrets/

      - name: Wait for UI containers
        run: |
          # docker-compose.yml doesn't publish host ports — Tailscale sidecars
          # are the only intended ingress. For CI we exec into the containers
          # via the internal `tailnet` network (no host port mapping needed).
          for i in $(seq 1 30); do
            if docker compose exec -T ui-router wget -q -O- http://localhost:3002 >/dev/null 2>&1 \
            && docker compose exec -T ui sh -c "wget -q -O- http://localhost:3000 >/dev/null 2>&1 && wget -q -O- http://localhost:3001 >/dev/null 2>&1"; then
              echo "all three reachable"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200
          echo "containers failed to come up"
          exit 1

      - name: Verify auth endpoints
        run: |
          # NextAuth's /api/auth/providers must return JSON on both ports.
          docker compose exec -T ui-router wget -q -O- http://localhost:3002/ >/dev/null
          docker compose exec -T ui sh -c "wget -q -O- http://localhost:3000/api/auth/providers | grep -q credentials && wget -q -O- http://localhost:3001/api/auth/providers | grep -q credentials"

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  # ── Notify: PDF summary + email ─────────────────────────────────────────
  # Builds a one-page PDF with what was deployed, what's new, and what's
  # changed (git log between previous tag and this one). Uploads it as an
  # artifact (always) and emails it if SMTP_* + NOTIFY_EMAIL secrets are set.
  notify-release:
    name: Generate release PDF + email
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history so `git log <prev>..HEAD` has something
          # to enumerate.
          fetch-depth: 0

      - name: Determine tag + previous tag
        id: refs
        run: |
          # Either the tag that triggered the run, or the manual override.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag || 'latest' }}"
          fi
          # Find the previous tag (skip "latest" pseudo-tags). If none,
          # PREVIOUS_TAG stays empty and the PDF lists the last 25 commits.
          PREV=$(git tag --sort=-version:refname --no-contains "${TAG}" \
                 | grep -E '^v[0-9]' | head -n 1 || true)
          echo "tag=${TAG}"      >> "$GITHUB_OUTPUT"
          echo "previous=${PREV:-}" >> "$GITHUB_OUTPUT"

      - name: Resolve image digests from Docker Hub
        id: digests
        env:
          TAG: ${{ steps.refs.outputs.tag }}
        run: |
          set -euo pipefail
          for n in ui-router ui trainer; do
            d=$(docker buildx imagetools inspect \
              "docker.io/pratic2001/llmforge-${n}:${TAG}" \
              --raw 2>/dev/null \
              | awk -F'[@ ]' '/^[0-9a-f]{64}$/ {print "sha256:"$1; exit}' || true)
            if [[ -z "${d:-}" ]]; then
              d="(digest not resolved)"
            fi
            echo "${n//-/_}_digest=${d}" >> "$GITHUB_OUTPUT"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pdfkit
        run: npm install --no-save pdfkit@0.15.0

      - name: Generate release PDF
        env:
          RELEASE_TAG:        ${{ steps.refs.outputs.tag }}
          RELEASE_DATE:       ${{ github.event.repository.updated_at }}
          RELEASE_REPO_URL:   ${{ github.server_url }}/${{ github.repository }}
          RELEASE_COMMIT:     ${{ github.sha }}
          PREVIOUS_TAG:       ${{ steps.refs.outputs.previous }}
          PUBLIC_HOSTNAME:    ${{ secrets.PUBLIC_HOSTNAME }}
          ROUTER_REF:         pratic2001/llmforge-ui-router:${{ steps.refs.outputs.tag }}
          UI_REF:             pratic2001/llmforge-ui:${{ steps.refs.outputs.tag }}
          TRAINER_REF:        pratic2001/llmforge-trainer:${{ steps.refs.outputs.tag }}
          ROUTER_DIGEST:      ${{ steps.digests.outputs.ui_router_digest }}
          UI_DIGEST:          ${{ steps.digests.outputs.ui_digest }}
          TRAINER_DIGEST:     ${{ steps.digests.outputs.trainer_digest }}
        run: |
          node .github/scripts/generate-release-pdf.cjs
          ls -la release.pdf

      - name: Upload release PDF (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-summary-${{ steps.refs.outputs.tag }}
          path: release.pdf
          # 90 days so the PDF is recoverable for post-release audits.
          retention-days: 90

      - name: Email release PDF
        if: ${{ secrets.SMTP_HOST != '' && secrets.NOTIFY_EMAIL != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT || 465 }}
          secure:         ${{ secrets.SMTP_SECURE || 'true' }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          from:           llmforge release bot <${{ secrets.SMTP_USERNAME }}>
          to:             ${{ secrets.NOTIFY_EMAIL }}
          subject:        "llmforge ${{ steps.refs.outputs.tag }} deployed"
          body: |
            llmforge ${{ steps.refs.outputs.tag }} was just deployed to Docker Hub.

            Three images:
              pratic2001/llmforge-ui-router:${{ steps.refs.outputs.tag }}
              pratic2001/llmforge-ui:${{ steps.refs.outputs.tag }}
              pratic2001/llmforge-trainer:${{ steps.refs.outputs.tag }}

            Attached: release.pdf with the full summary (digest list, what's new,
            commit log, deployment instructions).

            View the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: release.pdf
          # Don't fail the workflow if SMTP is flaky — the artifact is the
          # canonical source of truth.
          ignore_error: true

      - name: Skip-email notice
        if: ${{ secrets.SMTP_HOST == '' || secrets.NOTIFY_EMAIL == '' }}
        run: |
          cat <<'EOF'
          ::notice::Email step skipped. To receive release PDFs by email,
          set these GH Secrets (Settings → Secrets and variables → Actions):
            SMTP_HOST       e.g. smtp.gmail.com
            SMTP_PORT       465 (default)
            SMTP_USERNAME   e.g. cpratic8@gmail.com
            SMTP_PASSWORD   Gmail app password (https://myaccount.google.com/apppasswords)
            NOTIFY_EMAIL    address to send to (defaults to SMTP_USERNAME)
          The PDF is always uploaded as a workflow artifact regardless.
          EOF